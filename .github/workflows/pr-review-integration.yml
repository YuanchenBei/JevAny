name: Review publisher integration

on:
  workflow_dispatch:
  push:
    branches: [automation/pr-review]
    paths: ['.github/review/**', '.github/workflows/pr-review-integration.yml']

permissions:
  contents: read

concurrency:
  group: pr-review-controller
  cancel-in-progress: false

jobs:
  publisher-api:
    if: github.repository == 'YuanchenBei/JevAny' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/automation/pr-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/review/requirements.txt PyYAML==6.0.2
      - name: Verify policy before exercising GitHub approval APIs
        run: python -m unittest discover -s .github/review/tests -v
      - name: Exercise real publication with a marked synthetic fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/review/integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publisher-integration-result
          path: integration-result.json
          retention-days: 7
