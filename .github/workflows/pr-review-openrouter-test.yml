name: OpenRouter review quality test

on:
  workflow_dispatch:
  push:
    branches: [automation/openrouter-test]
    paths: ['.github/review/**', '.github/workflows/pr-review*.yml']

permissions:
  contents: read

concurrency:
  group: pr-review-controller
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.repository == 'YuanchenBei/JevAny' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/automation/openrouter-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/review/requirements.txt PyYAML==6.0.2
      - name: Verify deterministic rules before spending API credits
        run: python -m unittest discover -s .github/review/tests -v
      - name: Review two real document fixtures twice with OpenRouter
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_REVIEW_PROVIDER: openrouter
          # Explicit pilot choice; the regular controller has no default model.
          PR_REVIEW_MODEL: openai/gpt-5-mini
        run: python .github/review/live.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: openrouter-quality-observations
          path: live-review-observations.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrouter-review-result
          path: live-review-result.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/review/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openrouter-review-result
          path: review-artifact
      - name: Publish real findings as comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REVIEW_MODE: report-only
        run: python .github/review/review.py publish --input review-artifact/live-review-result.json
